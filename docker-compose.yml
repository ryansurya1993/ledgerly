# Local dev / self-serve scaling demo stack: Postgres, Redis, RabbitMQ,
# ledger-service, wallet-service, and notification-service, all
# reachable from each other by service name on the `ledgerly` network
# (e.g. wallet-service calls ledger-service at
# http://ledger-service:8080, never localhost).
#
# `docker-compose up` alone brings up a fully working stack -- no
# manual ALTER ROLE step, no manual .env file required. The
# LEDGER_MIGRATE_DB_PASSWORD / LEDGER_APP_DB_PASSWORD / RABBITMQ_USER /
# RABBITMQ_PASSWORD defaults below (via `${VAR:-default}`) are
# throwaway local-dev-only credentials, committed on purpose, the same
# way `internal/ledger`'s test suite hardcodes its own throwaway
# Postgres password -- see that package's
# testdb_test.go. They are never used in production; production sets
# real values from a Kubernetes Secret (see each service's README). To
# override them locally instead of editing this file, copy
# `.env.example` to `.env` (gitignored) and change the values there --
# Compose loads `.env` automatically.
#
# Postgres, Redis, and RabbitMQ deliberately publish no ports to the
# host below -- a production-minded setup never exposes the data/broker
# layer directly, only the services that are meant to be reached from
# outside the cluster (here, ledger-service, wallet-service, and
# notification-service). Every service still reaches all three over the
# internal `ledgerly` network by service name (`postgres:5432`,
# `redis:6379`, `rabbitmq:5672`) without any published port at all --
# that's how Compose networking works regardless. If you need
# `psql`/`redis-cli`/the RabbitMQ management UI from your host for local
# debugging, either run `docker compose exec postgres psql -U postgres
# -d ledgerly` / `docker compose exec redis redis-cli`, or copy
# `docker-compose.override.yml.example` to `docker-compose.override.yml`
# (gitignored, auto-loaded by Compose) to publish those ports back.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LEDGER_MIGRATE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${LEDGER_MIGRATE_DB_PASSWORD:-devsecret_migrate}
      POSTGRES_DB: ${LEDGER_DB_NAME:-ledgerly}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LEDGER_MIGRATE_DB_USER:-postgres} -d ${LEDGER_DB_NAME:-ledgerly}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ledgerly

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ledgerly

  # -management includes the web console (opt-in on 15672, same
  # not-published-by-default policy as everything else here -- see
  # docker-compose.override.yml.example) for free: genuinely useful for
  # this project's purpose (see PROJECT_BRIEF.md) of being inspectable
  # and explainable, e.g. showing the ledger.events exchange and its
  # bindings live. RABBITMQ_DEFAULT_USER/PASS deliberately isn't
  # "guest"/"guest": RabbitMQ's default guest account can only
  # authenticate from localhost *inside its own container* -- a
  # restriction hardcoded to that literal username -- so ledger-service
  # and notification-service, connecting from other containers on this
  # network, would get a silent authentication failure against the
  # real default user. A custom username sidesteps that restriction
  # entirely. No named volume, unlike postgres: every queue here is
  # exclusive/auto-delete (see notification-service's
  # internal/events.Consumer) and the exchange carries no durable
  # unconsumed messages worth persisting across a restart -- see
  # ledger-service's internal/ledger/events.go for why this pipeline
  # has no durability guarantee to begin with. That also means a
  # recreated container just re-applies RABBITMQ_DEFAULT_USER/PASS
  # fresh rather than needing to reconcile them with a persisted state.
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ledgerly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devsecret_rabbitmq}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12
    networks:
      - ledgerly

  ledger-service:
    build:
      context: ./ledger-service
    environment:
      LEDGER_DB_HOST: postgres
      LEDGER_DB_PORT: "5432"
      LEDGER_DB_NAME: ${LEDGER_DB_NAME:-ledgerly}
      LEDGER_DB_SSLMODE: disable
      LEDGER_APP_DB_USER: ${LEDGER_APP_DB_USER:-ledger_app}
      LEDGER_APP_DB_PASSWORD: ${LEDGER_APP_DB_PASSWORD:-devsecret_app}
      LEDGER_MIGRATE_DB_USER: ${LEDGER_MIGRATE_DB_USER:-postgres}
      LEDGER_MIGRATE_DB_PASSWORD: ${LEDGER_MIGRATE_DB_PASSWORD:-devsecret_migrate}
      LEDGER_RABBITMQ_URL: amqp://${RABBITMQ_USER:-ledgerly}:${RABBITMQ_PASSWORD:-devsecret_rabbitmq}@rabbitmq:5672/
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # Not required for correctness -- ledger-service's own
      # internal/events.Publisher connects lazily and degrades to
      # "log and move on" if RabbitMQ isn't reachable (see that
      # package's doc comment) -- but gating startup on it here means
      # the very first transaction posted after `docker-compose up`
      # publishes successfully instead of silently logging one
      # avoidable failed attempt while RabbitMQ is still booting.
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks:
      - ledgerly

  wallet-service:
    build:
      context: ./wallet-service
    environment:
      PORT: "8081"
      LEDGER_SERVICE_URL: http://ledger-service:8080
      WALLET_REDIS_ADDR: redis:6379
      WALLET_REDIS_PASSWORD: ""
      WALLET_REDIS_DB: "0"
      WALLET_IDEMPOTENCY_TTL_HOURS: "24"
    ports:
      - "8081:8081"
    # No rabbitmq dependency here, unlike ledger-service and
    # notification-service below: wallet-service never talks to
    # RabbitMQ (or Postgres) directly -- see CLAUDE.md's architecture
    # section -- so it has nothing to gain from waiting on it.
    depends_on:
      ledger-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks:
      - ledgerly

  notification-service:
    build:
      context: ./notification-service
    environment:
      PORT: "8082"
      NOTIFICATION_RABBITMQ_URL: amqp://${RABBITMQ_USER:-ledgerly}:${RABBITMQ_PASSWORD:-devsecret_rabbitmq}@rabbitmq:5672/
    ports:
      - "8082:8082"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 10
    networks:
      - ledgerly

volumes:
  pg_data:

networks:
  ledgerly:
    driver: bridge
